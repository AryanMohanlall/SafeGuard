name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend/aspnet-core

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal
        working-directory: backend/aspnet-core

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/safeguard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/safeguard

      - name: Lint
        run: npm run lint
        working-directory: frontend/safeguard

      - name: Type Check
        run: npx tsc --noEmit
        working-directory: frontend/safeguard

      - name: Run unit tests
        run: npm test -- --coverage
        working-directory: frontend/safeguard

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/safeguard

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: frontend/safeguard
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/safeguard/playwright-report/
          retention-days: 7