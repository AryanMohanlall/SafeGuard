name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend/aspnet-core

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal
        working-directory: backend/aspnet-core

  frontend-lint:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/safeguard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/safeguard

      - name: Lint
        run: npm run lint
        working-directory: frontend/safeguard

