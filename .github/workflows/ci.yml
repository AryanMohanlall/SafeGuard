name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend/aspnet-core

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal
        working-directory: backend/aspnet-core

  frontend-lint:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/safeguard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/safeguard

      - name: Lint
        run: npm run lint
        working-directory: frontend/safeguard

    -   name: Type Check
        run: npx tsc --noEmit
        working-directory: frontend/safeguard

  # Uncomment and add a test script to package.json to enable frontend tests
  # frontend-tests:
  #   name: Frontend Tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "20"
  #         cache: "npm"
  #         cache-dependency-path: frontend/safeguard/package-lock.json
  #     - run: npm ci
  #       working-directory: frontend/safeguard
  #     - run: npm test
  #       working-directory: frontend/safeguard

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image safeguard-api:${{ github.sha }} \
            --image safeguard-api:latest \
            --file backend/aspnet-core/src/SafeGuard.Web.Host/Dockerfile \
            backend/aspnet-core

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/safeguard-api:${{ github.sha }}
